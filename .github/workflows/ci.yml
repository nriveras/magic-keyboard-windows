name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Builds and tests the user-mode workspace. The kernel driver needs the WDK and cargo-wdk and is
    # not built here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Script and INF tests
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\tests\run-tests.ps1
