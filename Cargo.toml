[workspace]
resolver = "2"
members = ["crates/mk-core", "crates/mk-hid", "crates/mk-probe", "crates/mk-app"]
exclude = ["driver/mkfilter"]
# The kernel driver (driver/mkfilter) is built separately with cargo-wdk; it has its own
# profile requirements (panic=abort, no std) and is intentionally not a workspace member.

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["nriveras"]
license = "MIT"
repository = "https://github.com/nriveras/magic-keyboard-windows"
rust-version = "1.85"  # eframe 0.32

[workspace.dependencies]
mk-core = { path = "crates/mk-core" }
