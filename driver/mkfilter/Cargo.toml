[package]
name = "mkfilter"
description = "KMDF lower filter for the Apple Magic Keyboard keyboard collection"
version = "0.1.0"
edition = "2024"
authors = ["nriveras"]
license = "MIT"
repository = "https://github.com/nriveras/magic-keyboard-windows"

[package.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33

[lib]
crate-type = ["cdylib"]

[build-dependencies]
wdk-build = "0.6.0"

[dependencies]
wdk = "0.5.0"
wdk-alloc = "0.4.2"
wdk-panic = "0.5.0"
wdk-sys = { version = "0.5.2", features = ["hid"] }
mk-core = { path = "../../crates/mk-core" }

[features]
default = []
nightly = ["wdk/nightly", "wdk-sys/nightly"]

[profile.dev]
panic = "abort"

[profile.release]
lto = true
panic = "abort"
